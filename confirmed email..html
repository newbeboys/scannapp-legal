<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Terkonfirmasi — ScannApp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #2563EB 0%, #1d4ed8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 48px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }
  .icon-wrap {
    width: 80px;
    height: 80px;
    background: #ecfdf5;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .icon-wrap svg {
    width: 40px;
    height: 40px;
  }
  h1 {
    font-size: 22px;
    color: #111827;
    margin-bottom: 12px;
    font-weight: 700;
  }
  p {
    font-size: 15px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .app-name {
    color: #2563EB;
    font-weight: 600;
  }
  .btn {
    display: inline-block;
    background: #2563EB;
    color: #ffffff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    transition: background 0.2s;
  }
  .btn:active {
    background: #1d4ed8;
  }
  .footer-note {
    margin-top: 24px;
    font-size: 13px;
    color: #9ca3af;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17L4 12" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Email Berhasil Dikonfirmasi!</h1>
    <p>
      Akun kamu di <span class="app-name">ScannApp</span> sudah aktif.
      Silakan buka aplikasi ScannApp di HP kamu dan login menggunakan email serta password yang sudah didaftarkan.
    </p>
    <a class="btn" href="intent://open#Intent;package=com.newbeboys.scannapp;end">
      Buka Aplikasi ScannApp
    </a>
    <p class="footer-note">
      Kalau tombol di atas tidak berfungsi, buka aplikasi ScannApp secara manual dari HP kamu.
    </p>
  </div>
</body>
</html>
